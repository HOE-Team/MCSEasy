name: Build MCSEasy Beta For Cross-Platform

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: '版本号，例如 v1.5.0.0'
        required: false
        default: 'v1.5.0.0'
      release_type:
        type: string
        description: '发行类型，例如 Beta, RC1, GA'
        required: false
        default: 'Beta'

jobs:
  build-multi:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Normalize inputs and build artifact tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || 'v0.0.0' }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type || 'Beta' }}"
          case "$RELEASE_TYPE" in
            Beta|beta) RELEASE_TYPE='Beta' ;;
            RC|rc|RC1|rc1) RELEASE_TYPE='RC1' ;;
            *) RELEASE_TYPE='GA' ;;
          esac
          echo "ARTIFACT_TAG=${VERSION}-${RELEASE_TYPE}" >> $GITHUB_ENV

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\windows"
          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          pyinstaller --clean --noconfirm --log-level=ERROR --onefile --windowed --name=MCSEasy `
            --icon="$env:GITHUB_WORKSPACE\icon.ico" `
            --add-data="$env:GITHUB_WORKSPACE\svg;svg" `
            --add-data="$env:GITHUB_WORKSPACE\icon.png;." `
            --add-data="$env:GITHUB_WORKSPACE\icon.ico;." `
            --distpath $dist --workpath "$env:GITHUB_WORKSPACE\build_windows" `
            --specpath "$env:GITHUB_WORKSPACE\build_windows" --optimize=2 `
            --exclude-module tkinter --exclude-module tests `
            main.py
          if (Test-Path $dist) { Get-ChildItem -Path $dist | Write-Output }
          echo "ARTIFACT_PATH=dist\windows" >> $env:GITHUB_ENV

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dist="$GITHUB_WORKSPACE/dist/macos"
          rm -rf "$dist"
          pyinstaller --clean --noconfirm --log-level=ERROR --onefile --windowed --name=MCSEasy \
            --icon="$GITHUB_WORKSPACE/icon.icns" \
            --add-data "$GITHUB_WORKSPACE/svg:svg" \
            --add-data "$GITHUB_WORKSPACE/icon.png:." \
            --add-data "$GITHUB_WORKSPACE/icon.icns:." \
            --distpath "$dist" --workpath "$GITHUB_WORKSPACE/build_macos" \
            --specpath "$GITHUB_WORKSPACE/build_macos" --optimize=2 --strip \
            --exclude-module tkinter --exclude-module tests \
            main.py
          ls -la "$dist"
          echo "ARTIFACT_PATH=dist/macos" >> $GITHUB_ENV

      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dist="$GITHUB_WORKSPACE/dist/linux"
          rm -rf "$dist"
          pyinstaller --clean --noconfirm --log-level=ERROR --onefile --name=MCSEasy \
            --icon="$GITHUB_WORKSPACE/icon.png" \
            --add-data "$GITHUB_WORKSPACE/svg:svg" \
            --add-data "$GITHUB_WORKSPACE/icon.png:." \
            --distpath "$dist" --workpath "$GITHUB_WORKSPACE/build_linux" \
            --specpath "$GITHUB_WORKSPACE/build_linux" --optimize=2 --strip \
            --exclude-module tkinter --exclude-module tests \
            main.py
          ls -la "$dist"
          echo "ARTIFACT_PATH=dist/linux" >> $GITHUB_ENV

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: MCSEasy Beta-${{ env.ARTIFACT_TAG }}-${{ matrix.os }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 7